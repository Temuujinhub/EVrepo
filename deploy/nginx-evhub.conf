# EV Hub — nginx: гадаад 8080 порт → дотоод 8100 (uvicorn).
# 202.21.117.180:8080 → энэ сервер (172.16.100.32):8080 гэж NAT хийгдсэн.
#
# Суулгах: /etc/nginx/sites-available/evhub → sites-enabled симлинк.
#
# ⚠ TLS (wss://): бодит домэйнгүй IP дээр Let's Encrypt авах боломжгүй тул
# эхний шатанд ws:// (шифрлэлтгүй). Winline HMI-д Server url:
#     ws://202.21.117.180:8080/ocpp/1.6/{cp_id}
# Домэйн (ж: ocpp.easy-parking.mn → 202.21.117.180) гармагц доорх 443/ssl
# блокыг нээж wss:// руу шилжинэ — EV_CHARGING_PLAN.md §3.4-ийн «wss заавал»
# шаардлага ТИЙМ ҮЕД бүрэн хангагдана. Түр хугацаанд цэнэглэгч бүрийн Basic
# нууц үг + cp_id≡username шалгалт л хамгаалалт болно.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # ── OCPP WebSocket ──────────────────────────────────────────────
    location /ocpp/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Цэнэглэгчийн урт холболт (§3.4): heartbeat 300с тул 3600с хангалттай
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Internal API (core → hub) — Bearer түлхүүрээр хамгаалагдсан ──
    location /internal/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        return 404;
    }
}

